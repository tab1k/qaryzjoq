services:
  web:
    build: .
    image: qaryzjoq-quiz-web
    container_name: qaryzjoq-quiz-web
    restart: unless-stopped
    env_file: .env
    ports:
      # только на внутренние адреса, куда ходит Nginx Proxy Manager; наружу порт не открываем
      - "172.17.0.1:8001:8000"
      - "172.21.0.1:8001:8000"
    networks:
      - proxy
    volumes:
      - db-quiz-data:/data           # файл SQLite переживает пересборку
    healthcheck:
      # X-Forwarded-Proto: https — иначе при DJANGO_USE_HTTPS=True Django редиректит на https://127.0.0.1 и проверка виснет
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,os; u.urlopen(u.Request('http://127.0.0.1:%s/' % os.environ.get('GUNICORN_PORT','8000'), headers={'X-Forwarded-Proto': 'https'}), timeout=4).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true

volumes:
  db-quiz-data:
