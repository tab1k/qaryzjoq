services:
  web:
    build: .
    image: qaryzjoq-web
    container_name: qaryzjoq-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # наружу отдаёт nginx/Caddy; для прямого доступа уберите 127.0.0.1:
    volumes:
      - db-data:/data           # файл SQLite переживает пересборку
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('GUNICORN_PORT','8000')).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
